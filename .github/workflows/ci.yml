name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A mulebox runner by default (it waits for a build slot in the mulebox queue).
    # Set the repository variable CI_RUNS_ON to e.g. ["ubuntu-24.04"] to use GitHub's.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","mulebox"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python environment
        # The venv lives in the runner's tool cache, so a self-hosted runner keeps it between
        # runs; dependencies are reinstalled only when pyproject.toml changes.
        run: |
          python3 --version
          venv="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/mulebox-ci/venv"
          stamp="$venv/.mulebox-deps"
          want="$(sha256sum pyproject.toml | cut -d' ' -f1)"
          if [ "$(cat "$stamp" 2>/dev/null)" != "$want" ]; then
            python3 -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check -q -e '.[dev]'
            echo "$want" > "$stamp"
          else
            "$venv/bin/python" -m pip install --disable-pip-version-check -q \
              --no-deps --no-build-isolation -e .
          fi
          echo "VENV=$venv" >> "$GITHUB_ENV"
      - name: Tests (includes the file-size check)
        run: '"$VENV/bin/python" -m pytest -n auto'
