name: ci

# The repository's own gate, safe for a public repository: rules in docs/releasing.md.
# tests/test_ci_workflow.py holds these to it.
# - GitHub-hosted machines only. Do not add `self-hosted` here, and keep no runner registered
#   on this repository: a pull request brings its own copy of this file.
# - `pull_request`, never `pull_request_target`, so a fork's code gets no secrets.
# - Read-only token, not stored in the checkout; actions pinned to a full commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The first is the minimum, requires-python in pyproject.toml.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -q -e '.[dev]'
      - name: File sizes
        run: python tools/check_line_counts.py
      - name: Tests
        run: python -m pytest -n auto
