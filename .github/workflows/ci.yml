name: ci

# The repository's own gate, safe for a public repository: rules in docs/releasing.md.
# tests/test_ci_workflow.py holds these to it.
# - The owner's own runs go to the node's isolated runner (`mulebox runner register
#   --isolated`, a fresh confined container per job); a fork's pull request and every run
#   another account started go to GitHub's machines. A pull request brings its own copy of
#   this file, so this routing is a convenience: the runner itself refuses anyone else's run
#   before any step (docs/releasing.md). `CI_RUNS_ON` (a repository variable, JSON) moves the
#   owner's runs elsewhere, such as `["ubuntu-24.04"]`, with no code change.
# - `pull_request`, never `pull_request_target`, so a fork's code gets no secrets.
# - Read-only token, not stored in the checkout; actions pinned to a full commit.
# - A change to docs alone runs nothing (paths-ignore below, the user's call, 2026-11-11).

on:
  push:
    branches: [main]
    paths-ignore: &docs
      # Docs only: nothing here is code, so no run. Root files by name, as the packaged
      # mulebox/client/skill/SKILL.md is code; docs/design-system/tokens.css is imported by web/.
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "PROJECT_LOG.md"
      - "LICENSE"
      - "VERSION"
      - "docs/**/*.md"
      - "docs/**/*.html"
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    # The owner's own runs on the node's isolated runner, every other run on GitHub's machines.
    runs-on: >-
      ${{ github.triggering_actor == github.repository_owner
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","mulebox-ci"]')
      || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The first is the minimum, requires-python in pyproject.toml.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -q -e '.[dev]'
      - name: File sizes
        run: python tools/check_line_counts.py
      - name: Tests
        run: python -m pytest -n auto

  macos:
    # A Mac can be a node (docs/install.md, A Mac as a node): the suite runs there too, on the
    # newest Python only. A version, not macos-latest, so the machine changes only when we say.
    name: test (macOS, Python 3.13)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -q -e '.[dev]'
      - name: Tests
        run: python -m pytest -n auto

  web:
    name: web (dashboard front end)
    # The owner's own runs on the node's isolated runner, every other run on GitHub's machines.
    runs-on: >-
      ${{ github.triggering_actor == github.repository_owner
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","mulebox-ci"]')
      || 'ubuntu-24.04' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      # eslint, then scripts/check-classes.mjs: no value typed in beside the design tokens.
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
