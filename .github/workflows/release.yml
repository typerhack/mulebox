name: release

# Publishes mulebox to PyPI when a version tag is pushed: rules in docs/releasing.md.
# - GitHub-hosted machines only, and never on a pull request.
# - Tags are pushed by maintainers only, when the user says to release.
# - Nothing secret is stored: PyPI trusts this workflow through its own identity (trusted
#   publishing), given only to the publish job, which runs nothing from the repository.
# - Actions pinned to a full commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: The tag is the version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      # Before the wheel: the dashboard's page goes into it, and is not in git.
      - name: Build the dashboard front end
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # PyPI shows the README but has none of its files: relative links go to the tag on GitHub.
      - name: Point the README's links at GitHub
        run: python tools/pypi_readme.py "$GITHUB_REF_NAME"
      - name: Build
        run: python -m pip wheel --disable-pip-version-check -q --no-deps -w dist .
      - name: Try it
        run: |
          python -c 'import glob, sys, zipfile; sys.exit("mulebox/dashboard/app/index.html" not in zipfile.ZipFile(glob.glob("dist/mulebox-*.whl")[0]).namelist())'
          python -m venv try
          try/bin/python -m pip install --disable-pip-version-check -q dist/mulebox-*.whl
          test "$(try/bin/mulebox --version)" = "mulebox $(cat VERSION)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mulebox/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          # PyPI never takes a file twice, so a tag pushed again (history rewritten in UTC,
          # 2026-11-12) would fail the run and mark the pypi deployment failed. Files already
          # there are left as they are; a new version still uploads.
          skip-existing: true
