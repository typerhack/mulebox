name: release

# The downloadable client, built when a version tag is pushed: rules in docs/releasing.md.
# - GitHub-hosted machines only, and never on a pull request.
# - Tags are pushed by maintainers only. The token can write, and only the steps that open and
#   fill the release are given it. The release stays a draft until a person publishes it.
# - Actions pinned to a full commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME"

  build:
    needs: draft
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --disable-pip-version-check -q '.[binary]'
          python tools/build_binary.py
      - name: Try it
        run: |
          mkdir try && tar xzf dist/mulebox-*.tar.gz -C try
          try/mulebox/mulebox --version
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/mulebox-*.tar.gz --clobber
