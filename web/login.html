<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>mulebox sign in</title>
  <link rel="stylesheet" href="/src/login/login.css">
</head>
<body class="login-page">
  <!-- The sign-in page of `lan` mode with a password. No script: the server fills in the
       message below (mulebox/dashboard/login.py) and the browser posts the form. -->
  <main class="login">
    <h1>mulebox</h1>
    <p class="lead">Sign in to see the build machines.</p>
    <!--message-->
    <form method="post" action="/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             required autofocus>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
