<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>mulebox</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1><a href="#/">mulebox</a></h1>
      <span id="version"></span>
    </div>
    <nav aria-label="Views">
      <a href="#/" data-nav="queue">Queue</a>
      <a href="#/history" data-nav="history">History</a>
    </nav>
    <div class="right">
      <span id="conn" class="conn" role="status" data-state="connecting">connecting</span>
      <button id="theme" class="icon" type="button" aria-label="Switch theme">
        <svg class="system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1"/><path d="M9 21h6M12 17v4"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button id="signout" type="button" hidden>Sign out</button>
    </div>
  </header>
  <main class="layout">
    <section id="cpu" class="box" aria-label="CPU"></section>
    <div class="side">
      <section id="mem" class="box" aria-label="Memory"></section>
      <section id="disk" class="box" aria-label="Disk"></section>
    </div>
    <section id="machines" class="box" aria-label="Machines"></section>
    <section id="work" class="box" aria-live="off">
      <h2>Jobs</h2>
      <div class="body">
        <p class="muted">Loading. If this stays, a browser extension may be blocking the page's
        scripts; allow them for this page, or use `mulebox queue` in a terminal.</p>
      </div>
    </section>
  </main>
  <noscript>The dashboard needs JavaScript. `mulebox queue` shows the same data.</noscript>
</body>
</html>
