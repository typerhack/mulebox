[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mulebox"
dynamic = ["version"]
description = "Send AI coding agents' builds and tests to Linux machines on your network, through one queue"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Runtime dependencies are added (and pinned) by the module that first needs them.
dependencies = [
    "PyYAML==6.0.3",
    "aiohttp==3.14.5",  # dashboard (M2)
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
    "setuptools==84.2.1",
]

[project.scripts]
mulebox = "mulebox.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["mulebox*"]

[tool.setuptools.package-data]
"mulebox.dashboard" = ["static/*"]
"mulebox.client" = ["skill/SKILL.md"]
"mulebox.machine" = ["install.sh", "*.example", "systemd/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
