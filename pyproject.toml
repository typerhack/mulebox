[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mulebox"
dynamic = ["version"]
description = "Send AI coding agents' builds and tests to Linux machines on your network, through one queue"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Runtime dependencies are added (and pinned) by the module that first needs them.
dependencies = [
    "PyYAML==6.0.3",
    "aiohttp==3.14.5",  # dashboard (M2)
]

classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/typerhack/mulebox"
Documentation = "https://github.com/typerhack/mulebox/tree/main/docs"
Issues = "https://github.com/typerhack/mulebox/issues"
Changelog = "https://github.com/typerhack/mulebox/blob/main/PROJECT_LOG.md"

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
    "setuptools==84.2.1",
]

[project.scripts]
mulebox = "mulebox.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["mulebox*"]

[tool.setuptools.package-data]
"mulebox.dashboard" = ["app/*", "app/assets/*", "app/fonts/*"]
"mulebox.client" = ["skill/SKILL.md"]
"mulebox.machine" = ["install.sh", "*.example", "systemd/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
